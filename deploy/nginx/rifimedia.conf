server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.com www.example.com;

    root /var/www/rifimedia/current/public;
    index index.php;
    autoindex off;
    server_tokens off;
    client_max_body_size 100m;
    send_timeout 3600s;
    keepalive_timeout 65s;

    ssl_certificate /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # Content-Security-Policy is emitted by App\Http\Middleware\SecurityHeaders.

    limit_conn rifimedia_connections 30;
    limit_req zone=rifimedia_general burst=30 nodelay;

    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(?:env|ini|log|sql|sqlite|bak|backup|old|orig|swp|zip|tar|gz|7z|rar)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(?:vendor|node_modules|storage|database|tests|bootstrap/cache|\.git|\.svn)/ {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* ^/(?:composer\.(?:json|lock)|package(?:-lock)?\.json|phpunit\.xml|artisan|README\.md)$ {
        deny all;
    }

    location ^~ /build/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ^~ /brand/ {
        try_files $uri =404;
        expires 7d;
        access_log off;
    }

    location ~ ^/(?:admin/login|api/auth/(?:login|register|forgot-password|reset-password)) {
        limit_req zone=rifimedia_auth burst=5 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/api/ {
        limit_req zone=rifimedia_api burst=15 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ ^/(?:stream|bridge|go|bridge-channel)/ {
        limit_req zone=rifimedia_stream burst=5 nodelay;
        limit_conn rifimedia_connections 5;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /play/iptv/ {
        limit_req zone=rifimedia_stream burst=5 nodelay;
        limit_conn rifimedia_connections 5;
        proxy_buffering off;
        proxy_request_buffering off;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        gzip off;
        add_header X-Accel-Buffering no always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /play/iptv-source/ {
        limit_req zone=rifimedia_stream burst=5 nodelay;
        limit_conn rifimedia_connections 5;
        proxy_buffering off;
        proxy_request_buffering off;
        fastcgi_buffering off;
        fastcgi_request_buffering off;
        gzip off;
        add_header X-Accel-Buffering no always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        fastcgi_read_timeout 3600s;
        fastcgi_send_timeout 3600s;
        fastcgi_hide_header X-Powered-By;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt { access_log off; log_not_found off; }

    access_log /var/log/nginx/rifimedia.access.log;
    error_log /var/log/nginx/rifimedia.error.log warn;
}
