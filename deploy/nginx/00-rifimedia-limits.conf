# Install as /etc/nginx/conf.d/00-rifimedia-limits.conf (http context).
limit_req_zone $binary_remote_addr zone=rifimedia_general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=rifimedia_api:10m rate=3r/s;
limit_req_zone $binary_remote_addr zone=rifimedia_auth:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=rifimedia_stream:10m rate=10r/m;
limit_conn_zone $binary_remote_addr zone=rifimedia_connections:10m;
